[project]
name = "bilqis-mlx-private"
version = "1.4.1"
description = "Private, source-grounded MLX successor to Bilqis School50"
requires-python = ">=3.11"
dependencies = ["cryptography", "rdflib==7.6.0"]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "pytest-testmon>=2.3,<3",
  "pytest-xdist>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["bilqis_mlx*", "lib.ithkuil*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
"bilqis_mlx.bootstrap_assets" = [
  "source-run/*.json",
  "source-run/states/*.json",
  "source-run/factory-releases/*.json",
  "source-run/bundles/*/*.json",
  "atlas/*/*.json",
  "atlas/*/*.jsonl",
]
