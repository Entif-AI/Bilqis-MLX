[project]
name = "bilqis-mlx-private"
version = "1.1.0"
description = "Private, source-grounded MLX successor to Bilqis School50"
requires-python = ">=3.11"
dependencies = ["cryptography", "rdflib==7.6.0"]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "pytest-testmon>=2.3,<3",
  "pytest-xdist>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["bilqis_mlx*", "lib.ithkuil*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
