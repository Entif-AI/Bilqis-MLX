name: Bilqis MLX exhaustive semantic profile

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/bamf-unified-base-20261028
    paths:
      - 'lib/ithkuil/**'
      - 'skills/ithkuil-ingestion/**'
      - 'scripts/package_ithkuil_skill.py'
      - 'scripts/skos_test_policy.py'
      - 'scripts/run_tests.py'
      - '.github/workflows/quality.yml'
      - '.github/workflows/semantic-profile-full.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: bilqis-semantic-exhaustive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt:
    name: semantic-receipt-current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify semantic bundle receipt
        run: python3 -B scripts/skos_test_policy.py status

  full:
    name: semantic-profile-full-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install semantic profile dependencies
        run: >-
          python3 -m pip install
          -r lib/ithkuil/requirements-extraction.txt
          -r lib/ithkuil/requirements-falkor.txt
      - name: Verify exhaustive deterministic semantic profile shard
        run: >-
          python3 -B scripts/skos_test_policy.py run
          --force-full
          --full-shard-index ${{ matrix.shard }}
          --full-shard-count 8
