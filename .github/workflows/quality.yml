name: Bilqis MLX portable verification

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release manifests and changelog
        run: python3 -B scripts/release_version.py --check
      - name: Enforce ratified development structure on changed paths
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_REF="$QUALITY_BASE_REF"
          case "$BASE_REF" in
            ""|0000000000000000000000000000000000000000) BASE_REF=HEAD ;;
          esac
          python3 -B scripts/check_module_size.py --changed-from "$BASE_REF"
          python3 -B scripts/quality/check_governance_integrity.py --base-ref "$BASE_REF"
      - name: Install historical semantic integrity dependencies
        run: python3 -m pip install -r lib/ithkuil/requirements-semantic.txt
      - name: Check historical semantic integrity
        run: python3 -B scripts/check_historical_abi.py
      - name: Check legacy semantic package ownership
        if: >-
          ${{
            (!contains(github.ref_name, 'bamf') && !contains(github.head_ref, 'bamf'))
          }}
        run: python3 -B scripts/check_semantic_boundaries.py
      - name: Verify portable BAMF semantic contracts
        if: >-
          ${{
            (contains(github.ref_name, 'bamf') || contains(github.head_ref, 'bamf'))
          }}
        run: >-
          python3 -B scripts/run_tests.py
          bilqis_mlx/factory/tests/test_factory_construction.py
          bilqis_mlx/factory/tests/test_curriculum_compiler.py
          bilqis_mlx/factory/tests/test_grade_admission.py
          bilqis_mlx/semantics/tests/foundation/test_domain_contracts.py
          bilqis_mlx/verification/tests/test_construction_contracts.py
          bilqis_mlx/factory/tests/test_release_outcome_contracts.py
      - name: Check architecture, documentation and error contracts
        run: |
          python3 -B scripts/check_factory_architecture.py
          python3 -B scripts/quality/check_docs.py
          python3 -B scripts/error_control_plane.py --check
      - name: Reject newly introduced code hygiene regressions
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_REF="$QUALITY_BASE_REF"
          case "$BASE_REF" in
            ""|0000000000000000000000000000000000000000) BASE_REF=HEAD ;;
          esac
          python3 -B scripts/code_smell_audit.py --changed-from "$BASE_REF" \
            --check-baseline docs/evidence/development/code_smell_baseline.json
      - name: Portable non-neural custody and release tests
        run: >-
          python3 -B scripts/run_tests.py
          bilqis_mlx/learning/tests/test_teacher_observations.py
          bilqis_mlx/runtime/tests/test_teacher_observation_capture.py
          bilqis_mlx/runtime/tests/test_teacher_observation_replay.py
          bilqis_mlx/runtime/tests/test_qualification.py
          bilqis_mlx/runtime/tests/test_model_topology.py
          bilqis_mlx/runtime/tests/test_topology_lifecycle.py
          bilqis_mlx/runtime/tests/test_state_archive.py
          bilqis_mlx/learning/tests/test_whole_student_retention.py
          scripts/tests/test_release_version.py
          scripts/tests/test_docs.py
          scripts/tests/test_run_tests.py
          scripts/tests/governance/test_module_size.py
          scripts/tests/governance/test_governance_integrity.py
          bilqis_mlx/factory/tests/test_release.py
          bilqis_mlx/factory/tests/test_generation.py
          bilqis_mlx/factory/tests/test_historical_generalization.py
          bilqis_mlx/runtime/tests/test_admission.py
      - name: Plan semantic profile verification
        id: skos
        env:
          SKOS_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          python3 -B scripts/skos_test_policy.py plan \
            --base-ref "$SKOS_BASE_REF" \
            --github-output "$GITHUB_OUTPUT"
      - name: Install semantic profile dependencies
        if: steps.skos.outputs.action != 'SKIP'
        run: >-
          python3 -m pip install
          -r lib/ithkuil/requirements-extraction.txt
          -r lib/ithkuil/requirements-falkor.txt
      - name: Verify deterministic source semantic profile
        if: steps.skos.outputs.action != 'SKIP'
        env:
          SKOS_BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 -B scripts/skos_test_policy.py run --base-ref "$SKOS_BASE_REF"
