name: Bilqis MLX portable verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bilqis-portable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: portable-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skos_action: ${{ steps.skos.outputs.action }}
      skos_reason: ${{ steps.skos.outputs.reason }}
      skos_sha256: ${{ steps.skos.outputs.sha256 }}
      expensive_tests: ${{ steps.test-impact.outputs.expensive_tests }}
      comparison_base: ${{ steps.comparison-base.outputs.base_ref }}
    steps:
      - name: Checkout private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Mission Control shell and Electron security boundary
        run: |
          node --version
          npm run mission-control:test
          npm run mission-control:security:test
      - name: Validate release manifests and changelog
        run: python3 -B scripts/maintenance/release_version.py --check
      - name: Resolve truthful comparison base
        id: comparison-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REF" == codex/bamf-main-bridge-* ]]; then
            JOIN_COMMIT=$(git rev-list --first-parent --merges --max-count=1 "$PR_BASE_SHA..$PR_HEAD_SHA")
            test -n "$JOIN_COMMIT"
            BASE_REF=$(git rev-parse "$JOIN_COMMIT^2")
            echo "Bridge cutover: comparing against joined unified baseline $BASE_REF"
          fi
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
      - name: Determine whether passing expensive suites were invalidated
        id: test-impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_BASE_REF: ${{ steps.comparison-base.outputs.base_ref }}
          QUALITY_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "expensive_tests=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch explicitly requests fresh verification."
            exit 0
          fi

          BASE_REF="$QUALITY_BASE_REF"
          case "$BASE_REF" in
            ""|0000000000000000000000000000000000000000)
              echo "expensive_tests=true" >> "$GITHUB_OUTPUT"
              echo "No trustworthy base ref; fail safe to fresh verification."
              exit 0
              ;;
          esac

          expensive=false
          while IFS= read -r path; do
            case "$path" in
              bilqis_mlx/*|\
              lib/ithkuil/*|\
              skills/ithkuil-ingestion/*|\
              pyproject.toml|\
              requirements*.txt|\
              package.json|\
              scripts/run_tests.py|\
              scripts/skos_test_policy.py|\
              scripts/skos_policy/*|\
              scripts/check_historical_abi.py|\
              scripts/check_semantic_boundaries.py)
                expensive=true
                echo "Expensive verification invalidated by: $path"
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_REF" "$QUALITY_HEAD_REF")
          echo "expensive_tests=$expensive" >> "$GITHUB_OUTPUT"
          if [[ "$expensive" != "true" ]]; then
            echo "No expensive-suite dependency surface changed; reusing prior passing evidence."
          fi
      - name: Enforce ratified development structure on changed paths
        env:
          QUALITY_BASE_REF: ${{ steps.comparison-base.outputs.base_ref }}
        run: |
          BASE_REF="$QUALITY_BASE_REF"
          case "$BASE_REF" in
            ""|0000000000000000000000000000000000000000) BASE_REF=HEAD ;;
          esac
          python3 -B scripts/check_module_size.py --changed-from "$BASE_REF"
          python3 -B scripts/quality/check_governance_integrity.py --base-ref "$BASE_REF"
      - name: Check BAMF flow-control policy
        run: |
          python3 -B scripts/check_bamf_flow_control.py
      - name: Install historical semantic integrity dependencies
        if: steps.test-impact.outputs.expensive_tests == 'true'
        run: python3 -m pip install -r lib/ithkuil/requirements-semantic.txt
      - name: Check historical semantic integrity
        if: steps.test-impact.outputs.expensive_tests == 'true'
        run: python3 -B scripts/check_historical_abi.py
      - name: Check legacy semantic package ownership
        if: >-
          ${{
            steps.test-impact.outputs.expensive_tests == 'true' &&
            (!contains(github.ref_name, 'bamf') && !contains(github.head_ref, 'bamf') && !contains(github.base_ref, 'bamf'))
          }}
        run: python3 -B scripts/check_semantic_boundaries.py
      - name: Verify portable BAMF semantic contracts
        if: >-
          ${{
            steps.test-impact.outputs.expensive_tests == 'true' &&
            (contains(github.ref_name, 'bamf') || contains(github.head_ref, 'bamf') || contains(github.base_ref, 'bamf'))
          }}
        run: >-
          python3 -B scripts/run_tests.py
          bilqis_mlx/factory/tests/curriculum/test_factory_construction.py
          bilqis_mlx/factory/tests/test_curriculum_compiler.py
          bilqis_mlx/factory/tests/test_grade_admission.py
          bilqis_mlx/semantics/tests/foundation/test_domain_contracts.py
          bilqis_mlx/verification/tests/test_construction_contracts.py
          bilqis_mlx/verification/coverage/tests
          bilqis_mlx/source_adapters/predecessor_parity/tests/test_contracts.py
          bilqis_mlx/factory/tests/lifecycle/test_release_outcome_contracts.py
      - name: Check architecture, documentation and error contracts
        env:
          QUALITY_BASE_REF: ${{ steps.comparison-base.outputs.base_ref }}
        run: |
          python3 -B scripts/check_factory_architecture.py
          python3 -B scripts/quality/check_docs.py
          if [ -n "$QUALITY_BASE_REF" ]; then
            python3 -B scripts/error_control_plane.py --check --base-ref "$QUALITY_BASE_REF"
          else
            python3 -B scripts/error_control_plane.py --check
          fi
      - name: Reject newly introduced code hygiene regressions
        env:
          QUALITY_BASE_REF: ${{ steps.comparison-base.outputs.base_ref }}
        run: |
          BASE_REF="$QUALITY_BASE_REF"
          case "$BASE_REF" in
            ""|0000000000000000000000000000000000000000) BASE_REF=HEAD ;;
          esac
          python3 -B scripts/code_smell_audit.py --changed-from "$BASE_REF" \
            --check-baseline docs/evidence/development/code_smell_baseline.json
      - name: Install portable custody dependencies
        if: steps.test-impact.outputs.expensive_tests == 'true'
        run: python3 -m pip install numpy==2.4.4
      - name: Portable non-neural custody and release tests
        if: steps.test-impact.outputs.expensive_tests == 'true'
        run: >-
          python3 -B scripts/run_tests.py
          bilqis_mlx/learning/_teaching/tests/test_teacher_observations.py
          bilqis_mlx/runtime/tests/teacher/test_teacher_observation_capture.py
          bilqis_mlx/runtime/tests/teacher/test_capture_identity.py
          bilqis_mlx/semantics/frame_codec_parts/tests
          bilqis_mlx/runtime/operator_session/tests
          bilqis_mlx/compatibility/live_release_parts/tests/test_providers.py
          bilqis_mlx/runtime/tests/teacher/test_teacher_observation_replay.py
          bilqis_mlx/runtime/tests/operator/test_qualification.py
          bilqis_mlx/runtime/tests/model/parity/test_model_topology.py
          bilqis_mlx/runtime/tests/model/test_topology_lifecycle.py
          bilqis_mlx/runtime/tests/custody/test_state_archive.py
          bilqis_mlx/learning/_retention/tests/test_whole_student_retention.py
          scripts/tests/test_release_version.py
          scripts/tests/test_docs.py
          scripts/tests/test_run_tests.py
          scripts/tests/test_run_tests_package_collision.py
          scripts/tests/tooling/test_skos_test_policy.py
          scripts/tests/governance/test_module_size.py
          scripts/tests/governance/test_governance_integrity.py
          bilqis_mlx/factory/tests/lifecycle/test_release.py
          bilqis_mlx/factory/tests/lifecycle/test_generation.py
          bilqis_mlx/factory/tests/curriculum/test_historical_generalization.py
          bilqis_mlx/runtime/tests/operator/test_admission.py
      - name: Plan semantic profile verification
        id: skos
        if: steps.test-impact.outputs.expensive_tests == 'true'
        env:
          SKOS_BASE_REF: ${{ steps.comparison-base.outputs.base_ref }}
        run: |
          python3 -B scripts/skos_test_policy.py plan \
            --base-ref "$SKOS_BASE_REF" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record reused passing test evidence
        if: steps.test-impact.outputs.expensive_tests != 'true'
        run: |
          echo "expensive test suites: NOT INVALIDATED"
          echo "No production/test dependency surface changed; prior passing evidence remains applicable."

  semantic-diff:
    name: semantic-profile-diff
    needs: core
    if: needs.core.result == 'success' && needs.core.outputs.expensive_tests == 'true' && needs.core.outputs.skos_action == 'DIFF'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install semantic profile dependencies
        run: >-
          python3 -m pip install
          -r lib/ithkuil/requirements-extraction.txt
          -r lib/ithkuil/requirements-falkor.txt
      - name: Verify impacted deterministic semantic profile
        env:
          SKOS_BASE_REF: ${{ needs.core.outputs.comparison_base }}
        run: python3 -B scripts/skos_test_policy.py run --base-ref "$SKOS_BASE_REF"

  semantic-full:
    name: semantic-profile-full-${{ matrix.shard }}
    needs: core
    if: needs.core.result == 'success' && needs.core.outputs.expensive_tests == 'true' && needs.core.outputs.skos_action == 'FULL'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install semantic profile dependencies
        run: >-
          python3 -m pip install
          -r lib/ithkuil/requirements-extraction.txt
          -r lib/ithkuil/requirements-falkor.txt
      - name: Verify exhaustive deterministic semantic profile shard
        env:
          SKOS_BASE_REF: ${{ needs.core.outputs.comparison_base }}
        run: >-
          python3 -B scripts/skos_test_policy.py run
          --base-ref "$SKOS_BASE_REF"
          --full-shard-index ${{ matrix.shard }}
          --full-shard-count 8

  portable:
    name: portable
    needs: [core, semantic-diff, semantic-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile portable verification result
        env:
          CORE_RESULT: ${{ needs.core.result }}
          SKOS_ACTION: ${{ needs.core.outputs.skos_action }}
          DIFF_RESULT: ${{ needs.semantic-diff.result }}
          FULL_RESULT: ${{ needs.semantic-full.result }}
        run: |
          set -eu
          if [ "$CORE_RESULT" != "success" ]; then
            echo "portable core failed: $CORE_RESULT"
            exit 1
          fi
          case "$SKOS_ACTION" in
            "")
              test "${{ needs.core.outputs.expensive_tests }}" != "true"
              test "$DIFF_RESULT" = "skipped"
              test "$FULL_RESULT" = "skipped"
              ;;
            SKIP)
              test "$DIFF_RESULT" = "skipped"
              test "$FULL_RESULT" = "skipped"
              ;;
            DIFF)
              test "$DIFF_RESULT" = "success"
              test "$FULL_RESULT" = "skipped"
              ;;
            FULL)
              test "$DIFF_RESULT" = "skipped"
              test "$FULL_RESULT" = "success"
              ;;
            *)
              echo "unexpected semantic plan: $SKOS_ACTION"
              exit 1
              ;;
          esac
          echo "PORTABLE_VERIFICATION_OK semantic=${SKOS_ACTION:-REUSED}"
