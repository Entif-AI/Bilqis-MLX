name: Conventional Commits

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR title and every commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/maintenance/release_version.py --validate-subject "$PR_TITLE"
          while IFS= read -r subject; do
            python3 -B scripts/maintenance/release_version.py --validate-subject "$subject"
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
